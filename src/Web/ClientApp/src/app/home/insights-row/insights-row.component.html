<div class="ir-card-row" role="list" aria-label="Financial insights">

  @for (card of cards(); track card.id; let i = $index) {
    <app-insight-card
      [insight]="card"
      [animDelay]="i * 60"
      (ctaClick)="onCtaClick(i)" />
  }

  @for (s of skeletons(); track s) {
    <div class="ir-skeleton" aria-hidden="true">
      <div class="ir-skel-orb"></div>
      <div class="ir-skel-line ir-skel-line--wide"></div>
      <div class="ir-skel-line ir-skel-line--narrow"></div>
      <div class="ir-skel-btn"></div>
    </div>
  }

</div>
