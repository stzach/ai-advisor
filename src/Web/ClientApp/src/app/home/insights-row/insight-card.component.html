<div class="card-wrapper" role="listitem" [style.--orb-delay.ms]="animDelay()">
  <div class="card">
    <div class="card-orb-wrap">
      <app-insight-orb [category]="insight().category" [icon]="insight().icon" />
    </div>
    <span class="card-tag">{{ insight().tag }}</span>
    <button class="card-cta" (click)="ctaClick.emit()">
      {{ insight().cta }}
    </button>
  </div>
</div>
