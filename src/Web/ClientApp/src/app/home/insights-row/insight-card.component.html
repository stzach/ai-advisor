<div class="ic-row"
     [attr.data-category]="insight().category"
     (click)="ctaClick.emit()"
     role="button"
     tabindex="0"
     (keyup.enter)="ctaClick.emit()">
  <div class="ic-icon">
    <span>{{ insight().icon }}</span>
  </div>
  <div class="ic-info">
    <span class="ic-tag">{{ insight().tag }}</span>
    <span class="ic-cta">{{ insight().cta }}</span>
  </div>
  <span class="ic-arrow">›</span>
</div>
