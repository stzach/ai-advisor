<app-nav-menu></app-nav-menu>
<main>
  <router-outlet></router-outlet>
</main>

@if (isAuthenticated && !isChatPage) {
  <div class="chat-widget">

    <!-- ── Chat panel ──────────────────────────────────────────────────────── -->
    <div class="chat-panel" [class.open]="chatHub.isOpen$ | async">

      <div class="chat-panel-header">
        <div class="chat-panel-avatar">
          <svg viewBox="0 0 32 32" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 3 L5 8.5 L5 17 C5 22.5 10 27.5 16 29.5 C22 27.5 27 22.5 27 17 L27 8.5 Z" fill="#ffffff"/>
          </svg>
        </div>
        <div class="chat-panel-info">
          <span class="chat-panel-name">How can I help?</span>
          <span class="chat-panel-status">
            <span class="chat-status-dot"></span> Online
          </span>
        </div>
        <button class="chat-panel-expand" aria-label="Expand">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 3 21 3 21 9"/>
            <polyline points="9 21 3 21 3 15"/>
            <line x1="21" y1="3" x2="14" y2="10"/>
            <line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
        </button>
        <button class="chat-panel-close" (click)="chatHub.close()" aria-label="Close chat">✕</button>
      </div>

      @if (!hasConsent()) {
        <!-- ── Consent screen ──────────────────────────────────────────────── -->
        <div class="chat-consent">
          <div class="chat-consent-card">
            <p class="chat-consent-title">Disclaimer &amp; Data Policy</p>
            <label class="chat-consent-label">
              <input type="checkbox"
                     class="chat-consent-check"
                     [checked]="consentChecked()"
                     (change)="consentChecked.set($any($event.target).checked)" />
              <span>I have read, understood and accept the
                <a href="#" class="chat-consent-link">terms of use</a>
                of the digital assistant (chatbot) service and I have been informed about the
                processing of my personal data as included in a separate section of the same
                file as the terms of use.</span>
            </label>
          </div>
          <button class="chat-consent-btn" [disabled]="!consentChecked()" (click)="giveConsent()">
            Continue
          </button>
        </div>
      } @else {
        <app-chat [isWidget]="true"></app-chat>
      }
    </div>

    <!-- ── Preview bubble (shown when panel is closed) ─────────────────────── -->
    @if (!(chatHub.isOpen$ | async) && showPreview()) {
      <div class="chat-preview-bubble">
        <button class="chat-preview-close" (click)="showPreview.set(false)" aria-label="Dismiss">✕</button>
        <div class="chat-preview-msg">Hello! How can I help?</div>
      </div>
    }

    <!-- ── Toggle button ───────────────────────────────────────────────────── -->
    <button class="chat-toggle-btn" [class.active]="chatHub.isOpen$ | async" (click)="chatHub.toggle()" aria-label="Toggle chat">
      @if (chatHub.isOpen$ | async) {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      } @else {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      }
    </button>

  </div>
}
