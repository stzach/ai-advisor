<app-nav-menu></app-nav-menu>
<main>
  <router-outlet></router-outlet>
</main>

@if (isAuthenticated && !isChatPage) {
  <div class="chat-widget">
    <div class="chat-panel" [class.open]="chatHub.isOpen$ | async">
      <div class="chat-panel-header">
        <div class="chat-panel-avatar">🧠</div>
        <div class="chat-panel-info">
          <span class="chat-panel-name">Financial Advisor</span>
          <span class="chat-panel-status">
            <span class="chat-status-dot"></span> Ready to help
          </span>
        </div>
        <button class="chat-panel-close" (click)="chatHub.close()" aria-label="Close chat">✕</button>
      </div>
      <app-chat [isWidget]="true"></app-chat>
    </div>
    @if (!(chatHub.isOpen$ | async)) {
      <div class="chat-prompts-strip">
        <p class="chat-prompts-label">Try asking</p>
        <button type="button" class="chat-prompt-chip" (click)="chatHub.openWithPrompt('How much did I spend this month and where can I cut back?')">
          How much did I spend this month?
        </button>
        <button type="button" class="chat-prompt-chip" (click)="chatHub.openWithPrompt('How do I open a savings account and start saving automatically?')">
          How do I start saving automatically?
        </button>
        <button type="button" class="chat-prompt-chip" (click)="chatHub.openWithPrompt('What is my biggest expense category and what can I do about it?')">
          What's my biggest expense?
        </button>
      </div>
    }
    <button class="chat-toggle-btn" [class.active]="chatHub.isOpen$ | async" (click)="chatHub.toggle()" aria-label="Toggle chat">
      @if (chatHub.isOpen$ | async) { ✕ } @else { 💬 }
    </button>
  </div>
}
