<div class="chat-voice-wrapper">
  <kendo-chat
    [messages]="(feed | async) ?? []"
    [authorId]="user.id"
    (sendMessage)="sendMessage($event)"
    (executeAction)="executeAction($event)"
  >
    <ng-template kendoChatReceiverMessageContentTemplate let-message>
      <div [innerHTML]="message.text | markdown"></div>
      @let speaking = (voice.currentSpeakingKey$ | async) === ('' + message.id);
      <button class="chat-speak-btn"
        [attr.aria-label]="speaking ? 'Stop reading' : 'Read aloud'"
        [attr.aria-pressed]="speaking"
        (click)="speak(message.id, message.text)">
        <span aria-hidden="true">{{ speaking ? '⏹' : '🔊' }}</span>
      </button>
    </ng-template>
  </kendo-chat>

  @if (voice.supported) {
    @let listening = !!(voice.isListening$ | async);
    <button class="chat-mic-btn"
      [class.listening]="listening"
      [attr.aria-label]="listening ? 'Stop listening' : 'Speak your message'"
      [attr.aria-pressed]="listening"
      (click)="toggleMic()">
      <span aria-hidden="true">{{ listening ? '⏹' : '🎤' }}</span>
    </button>
  }
</div>
