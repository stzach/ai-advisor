@if (!isWidget) {
  <div class="chat-fullpage-header">
    <div class="chat-panel-avatar">🧠</div>
    <div class="chat-panel-info">
      <span class="chat-panel-name">Financial Advisor</span>
      <span class="chat-panel-status">
        <span class="chat-status-dot"></span> Ready to help
      </span>
    </div>
    <button class="chat-panel-close" (click)="chatHub.clear()" title="Clear conversation">🗑</button>
  </div>
}

<div class="chat-fullpage-body" [class.chat-widget-body]="isWidget">
  <kendo-chat
    [messages]="(feed | async) ?? []"
    [authorId]="user.id"
    messageBoxPlaceholder="Type a message"
    (sendMessage)="sendMessage($event)"
    (executeAction)="executeAction($event)"
  >
    <ng-template kendoChatReceiverMessageContentTemplate let-message>
      @if (message.isEscalation) {
        <p class="escalation-text">{{ message.text }}</p>
        <div class="escalation-actions">
          <a href="tel:+210 326 0000" class="escalation-btn escalation-btn--call">
            <svg class="escalation-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/>
            </svg>
            Call Us Now
          </a>
          <a href="https://www.alpha.gr/el/idiotes/myalpha-rantevou" target="_blank" rel="noopener noreferrer" class="escalation-btn escalation-btn--book">
            <svg class="escalation-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M19 4h-1V2h-2v2H8V2H6v2H5C3.9 4 3 4.9 3 6v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/>
            </svg>
            Book Your Appointment
          </a>
        </div>
      } @else {
        <div [innerHTML]="message.text | markdown"></div>
      }
    </ng-template>
  </kendo-chat>
</div>
